<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — NearMe</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="site-header">
        <div class="nav-container">
            <a href="index.html" class="brand-logo">
                <span class="brand-icon">📍</span>
                <span>NearMe</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="register.html" class="btn-nav-primary">Register</a></li>
            </ul>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="auth-wrapper">
            <div class="auth-card">
                <h2>Login</h2>
                <p class="subtitle">Enter your email and password to access your account</p>

                <!-- Dynamic Alert Banner -->
                <div id="alertBox" style="display: none;"></div>

                <form action="../backend/login.php" method="POST">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">
                        Login
                    </button>
                </form>

                <p style="text-align: center; font-size: 0.9rem; margin-top: 1.5rem; color: var(--text-muted);">
                    Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Register here</a>
                </p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <p>&copy; 2026 NearMe. Built with Procedural PHP &amp; MySQL.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const params = new URLSearchParams(window.location.search);
            const alertBox = document.getElementById('alertBox');

            if (params.has('error')) {
                const err = params.get('error');
                let message = 'An error occurred during login.';
                if (err === 'invalid_credentials') {
                    message = 'Incorrect email or password. Please try again.';
                } else if (err === 'empty_fields') {
                    message = 'Please enter both email and password.';
                } else if (err === 'session_expired') {
                    message = 'Your session has expired. Please log in again.';
                }
                alertBox.className = 'alert alert-error';
                alertBox.innerHTML = `<span>⚠️</span> <span>${message}</span>`;
                alertBox.style.display = 'flex';
            } else if (params.has('logged_out')) {
                alertBox.className = 'alert alert-success';
                alertBox.innerHTML = `<span>✅</span> <span>You have logged out successfully.</span>`;
                alertBox.style.display = 'flex';
            } else if (params.has('registered')) {
                alertBox.className = 'alert alert-success';
                alertBox.innerHTML = `<span>✅</span> <span>Account created! Please log in.</span>`;
                alertBox.style.display = 'flex';
            }
        });
    </script>
</body>
</html>
